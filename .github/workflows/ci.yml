name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint (shellcheck)
        run: shellcheck ocd/scripts/*.sh

      - name: "Selftest (fixture suite: verify.sh + ocdify)"
        run: bash ocd/scripts/selftest.sh

      - name: Self-verify (this repo passes its own bar)
        run: bash ocd/scripts/verify.sh .
