name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install shellcheck; else sudo apt-get update && sudo apt-get install -y shellcheck; fi

      - name: Lint (shellcheck)
        run: shellcheck ocd/scripts/*.sh

      - name: Selftest (fixture suite)
        run: bash ocd/scripts/selftest.sh

      - name: Self-verify (this repo passes its own bar)
        run: bash ocd/scripts/verify.sh .
